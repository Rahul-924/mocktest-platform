# Starts MySQL + the Spring Boot API. Run the React app separately with `npm run dev` (see README).
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: mocktest
      MYSQL_USER: mocktest
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"   # reachable from your machine only
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/mocktest?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: mocktest
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS}
    ports:
      - "8080:8080"

volumes:
  dbdata:
